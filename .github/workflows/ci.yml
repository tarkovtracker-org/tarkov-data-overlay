name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm run audit:dependencies

      - name: Run Fallow security analysis
        run: npm run fallow:security -- --gate new --changed-since "${{ github.event.pull_request.base.sha || github.event.before }}"

      - name: Lint Markdown
        run: npm run lint:markdown

      - name: Typecheck
        run: npm run typecheck

      - name: Check monitor JavaScript
        run: npm run check:monitor

      - name: Run tests
        run: npm test

      - name: Validate source files
        run: npm run validate

      - name: Check overlay for data now supplied by tarkov.dev
        timeout-minutes: 15
        run: npm run check-overrides -- --fail-on-stale

      - name: Compute next overlay version
        id: version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git fetch --tags --force
          next_tag="$(npm run --silent next-overlay-tag)"
          if [[ ! "$next_tag" =~ ^v[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected next overlay tag: '$next_tag'" >&2
            exit 1
          fi
          echo "next_tag=$next_tag" >> "$GITHUB_OUTPUT"

      - name: Check generated overlay
        run: npm run build:check

      - name: Build overlay for release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          OVERLAY_VERSION: ${{ steps.version.outputs.next_tag }}
        run: |
          export OVERLAY_VERSION="${OVERLAY_VERSION#v}"
          npm run build

      - name: Build overlay
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: npm run build

      - name: Upload validated release overlay
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: overlay-${{ github.sha }}
          path: dist/overlay.json
          if-no-files-found: error
          overwrite: true
          retention-days: 30
