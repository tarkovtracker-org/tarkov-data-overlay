name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm run audit:dependencies

      - name: Run Fallow security analysis
        run: npm run fallow:security -- --gate new --changed-since "${{ github.event.pull_request.base.sha || github.event.before }}"

      - name: Lint Markdown
        run: npm run lint:markdown

      - name: Typecheck
        run: npm run typecheck

      - name: Check monitor JavaScript
        run: npm run check:monitor

      - name: Run tests
        run: npm test

      - name: Validate source files
        run: npm run validate

      - name: Check overlay for data now supplied by tarkov.dev
        timeout-minutes: 15
        run: npm run check-overrides -- --fail-on-stale

      - name: Compute next overlay version
        id: version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git fetch --tags --force
          TAG_LIST="$(git tag --list 'v*')" node <<'NODE' >> "$GITHUB_OUTPUT"
          const tags = (process.env.TAG_LIST || '').split(/\r?\n/).filter(Boolean);
          const parsed = tags.flatMap((tag) => {
            const match = /^v(\d+)\.(\d+)(?:\.(\d+))?(?:-([0-9A-Za-z.-]+))?$/.exec(tag);
            if (!match) return [];
            const parts = [match[1], match[2], match[3] || '0'].map(Number);
            return parts.every(Number.isSafeInteger)
              ? [{
                  major: parts[0],
                  minor: parts[1],
                  patch: parts[2],
                  prerelease: match[4] ? match[4].split('.') : undefined,
                }]
              : [];
          });
          parsed.sort((left, right) => {
            for (const key of ['major', 'minor', 'patch']) {
              if (left[key] !== right[key]) return left[key] - right[key];
            }
            if (!left.prerelease && !right.prerelease) return 0;
            if (!left.prerelease) return 1;
            if (!right.prerelease) return -1;
            const length = Math.max(left.prerelease.length, right.prerelease.length);
            for (let index = 0; index < length; index += 1) {
              const leftPart = left.prerelease[index];
              const rightPart = right.prerelease[index];
              if (leftPart === undefined) return -1;
              if (rightPart === undefined) return 1;
              const leftNumeric = /^\d+$/.test(leftPart);
              const rightNumeric = /^\d+$/.test(rightPart);
              if (leftNumeric && rightNumeric) {
                const difference = Number(leftPart) - Number(rightPart);
                if (difference !== 0) return difference;
              } else if (leftNumeric !== rightNumeric) {
                return leftNumeric ? -1 : 1;
              } else if (leftPart !== rightPart) {
                return leftPart < rightPart ? -1 : 1;
              }
            }
            return 0;
          });
          const latest = parsed.at(-1);
          console.log(`next_tag=${latest ? `v${latest.major}.${latest.minor + 1}` : 'v1.0'}`);
          NODE

      - name: Check generated overlay
        run: npm run build:check

      - name: Build overlay for release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          OVERLAY_VERSION: ${{ steps.version.outputs.next_tag }}
        run: |
          export OVERLAY_VERSION="${OVERLAY_VERSION#v}"
          npm run build

      - name: Build overlay
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: npm run build

      - name: Upload validated release overlay
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: overlay-${{ github.sha }}
          path: dist/overlay.json
          if-no-files-found: error
          retention-days: 7
